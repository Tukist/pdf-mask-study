<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ · 黑幕自测版</title>
<style>
  :root{
    --ink:#1b1b1b; --dim:#8b8779; --line:#e7e3da;
    --mask:#1a1a1a; --hl:#ffe9a8; --hl-ink:#b3261e;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:#f4f2ed; color:var(--ink);
    font-family:"FangSong","STFangsong","FangSong_GB2312","KaiTi","Microsoft YaHei",serif;
    font-size:17px; line-height:1.95;
  }
  header{position:sticky; top:0; z-index:10; background:rgba(244,242,237,.94);
         border-bottom:1px solid var(--line); backdrop-filter:blur(6px)}
  .bar{max-width:880px; margin:0 auto; padding:9px 18px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .bar h1{font-size:15px; margin:0; font-weight:600; letter-spacing:.5px; flex:1 1 auto}
  .bar h1 small{font-weight:400; color:var(--dim); margin-left:8px; font-size:12.5px}
  button{font:inherit; font-size:13px; padding:5px 12px; cursor:pointer; border:1px solid #cfcabd;
         background:#fff; color:#333; border-radius:6px; line-height:1.5}
  button:hover{background:#f0ede6}
  main{max-width:880px; margin:0 auto; padding:8px 18px 90px}
  .page{position:relative; background:#fff; border:1px solid var(--line); border-radius:10px;
        padding:26px 32px 20px; margin:16px 0; box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .page .pn{position:absolute; right:13px; top:9px; font-size:11px; color:#cdc8bb;
            font-family:system-ui,sans-serif}
  h1.t{font-size:22px; text-align:center; margin:12px 0 18px; letter-spacing:3px;
       font-family:"SimHei","Microsoft YaHei",sans-serif}
  h2.t{font-size:18px; margin:20px 0 10px; letter-spacing:1px;
       font-family:"SimHei","Microsoft YaHei",sans-serif}
  h2.t:first-child, h1.t:first-child{margin-top:6px}
  p{margin:0 0 10px; text-indent:2em; text-align:justify}
  b.b{
    font-weight:inherit; color:transparent; background:var(--mask);
    border-radius:3px; padding:0 1px; margin:0 1px; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  b.b:hover, b.b.on, b.b:hover.on{background:var(--hl); color:var(--hl-ink)}
  i.cl{display:inline-block; height:.78em; border-bottom:1.5px solid #b3ada0;
       vertical-align:-.05em; margin:0 .14em; min-width:1.2em}
  /* ---- 批注 ---- */
  .note{position:absolute; z-index:6; width:214px; border-radius:9px; overflow:hidden;
        box-shadow:0 3px 14px rgba(0,0,0,.18); font-family:"Microsoft YaHei",system-ui,sans-serif;
        font-size:13.5px; line-height:1.55; color:#20201c; background:#fff3a8;
        border:1px solid rgba(0,0,0,.08)}
  .note .nb{display:flex; align-items:center; padding:4px 4px 2px 7px; cursor:move;
            user-select:none; -webkit-user-select:none; touch-action:none}
  .note .dots{display:flex; gap:4px; flex:1}
  .note .dots i{width:11px; height:11px; border-radius:50%; cursor:pointer; display:block;
                border:1px solid rgba(0,0,0,.15); box-shadow:inset 0 0 0 1px #ffffff66}
  .note .dots i:hover{transform:scale(1.28)}
  .note .dx{border:0; background:none; font:inherit; font-size:15px; line-height:1;
            color:#00000050; cursor:pointer; padding:0 5px; border-radius:4px}
  .note .dx:hover{color:#b3261e; background:#00000012}
  .note .nt{padding:1px 9px 8px; min-height:1.45em; outline:none; white-space:pre-wrap;
            word-break:break-word; cursor:text}
  .note .nt:empty::before{content:"写点批注…"; color:#00000045}
  button.anno{border-style:dashed; color:#6b6350}
  button.act{background:#333c4a; color:#fff; border-color:#333c4a}
  /* ---- 手绘涂鸦 ---- */
  canvas.ink{position:absolute; inset:0; z-index:4; pointer-events:none;
             touch-action:none; border-radius:9px}
  body.draw canvas.ink{pointer-events:auto; cursor:crosshair}
  body.draw.eraser canvas.ink{cursor:cell}
  body.draw b.b{pointer-events:none}
  body.draw i.cl{pointer-events:none}
  body.draw .page{box-shadow:0 0 0 2px #ffd43b88, 0 1px 2px rgba(0,0,0,.03)}
  #pen{position:fixed; right:16px; bottom:16px; z-index:20; display:none;
       background:#fffbee; border:1px solid #e5ddc8; border-radius:12px;
       box-shadow:0 8px 26px rgba(0,0,0,.18); padding:10px 11px 9px;
       font-family:"Microsoft YaHei",system-ui,sans-serif; font-size:13px; width:214px}
  body.draw #pen{display:block}
  #pen .ttl{font-size:11.5px; color:#8d8677; margin:0 0 7px}
  #pen .pr{display:flex; align-items:center; gap:6px; margin-bottom:8px; flex-wrap:wrap}
  #pen .pr:last-child{margin-bottom:0}
  #pen .pc{width:21px; height:21px; border-radius:50%; cursor:pointer;
           border:2px solid #fff; box-shadow:0 0 0 1px #00000030}
  #pen .pc.act{box-shadow:0 0 0 2px #333c4a; transform:scale(1.08)}
  #pen button{font-size:12px; padding:3px 8px; border-radius:6px; background:#fff;
              border:1px solid #d8d2c0; color:#3c3a33}
  #pen button:hover{background:#f2eee0}
  #pen button.act{background:#333c4a; color:#fff; border-color:#333c4a}
  #pen .sep{flex:1 1 auto}
  #pen .x{position:absolute; right:6px; top:5px; border:0; background:none;
          font-size:15px; line-height:1; color:#aaa191; cursor:pointer; padding:2px 4px}
  #pen .x:hover{color:#b3261e}
  .hint{max-width:880px; margin:12px auto 0; padding:0 18px; font-size:12.5px;
        color:var(--dim); line-height:1.8}
  .k{color:#b3261e}
  .foot{max-width:880px; margin:4px auto 44px; padding:0 18px; text-align:center;
        font-size:12px; color:#c0baab; line-height:1.8}
  @media (max-width:560px){
    body{font-size:16px}
    main{padding:6px 8px 60px}
    .page{padding:18px 15px 14px}
    h1.t{font-size:19px}
    .bar{padding:8px 12px; gap:6px}
    .bar h1{font-size:14px; flex:1 1 100%}
    .bar h1 small{display:none}
    button{font-size:12px; padding:4px 9px}
    .hint{margin-top:8px; padding:0 12px; font-size:12px}
  }
  @media print{
    header,.hint,.foot{display:none}
    .note{display:none}
    body{background:#fff}
    .page{border:none; box-shadow:none; padding:0; margin:14px 0}
    b.b{background:#fff; color:#000; border-bottom:1px solid #999; border-radius:0}
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>__TITLE__ <small>黑幕自测 · 悬停/点击显示答案</small></h1>
    <button id="all">全部显示</button>
    <button id="none">全部隐藏</button>
    <button id="penBtn" title="打开后在页面上按住鼠标拖动即可画线">✎ 画笔</button>
    <button class="anno" id="exp" title="把批注和涂鸦存成 JSON 文件（备份/换设备用）">导出</button>
    <button class="anno" id="imp" title="从 JSON 备份文件恢复批注和涂鸦">导入</button>
    <button class="anno" id="clr" title="删除全部批注">清空批注</button>
    <input type="file" id="impf" accept=".json,application/json" hidden>
  </div>
</header>
<div id="pen">
  <button class="x" id="exitPen2" title="退出画笔">×</button>
  <div class="ttl">按住鼠标拖动＝画线；点颜色/粗细后继续画</div>
  <div class="pr">
    <span class="pc act" data-c="#e23b2e" style="background:#e23b2e" title="红色"></span>
    <span class="pc" data-c="#f08c00" style="background:#f08c00" title="橙色"></span>
    <span class="pc" data-c="#2f9e44" style="background:#2f9e44" title="绿色"></span>
    <span class="pc" data-c="#1971c2" style="background:#1971c2" title="蓝色"></span>
    <span class="pc" data-c="#111111" style="background:#111111" title="黑色"></span>
    <span class="pc" data-c="#ffd43b" style="background:#ffd43b" title="荧光黄（粗一点更好看）"></span>
  </div>
  <div class="pr">
    <button class="pw" data-w="0.0018">细</button>
    <button class="pw act" data-w="0.0035">中</button>
    <button class="pw" data-w="0.0075">粗</button>
    <span class="sep"></span>
    <button id="eraserBtn" title="点一下擦掉一整笔">橡皮</button>
  </div>
  <div class="pr">
    <button id="undoInk" title="撤销上一步（Ctrl+Z）">撤销</button>
    <button id="clrInk" title="清掉当前这一页的所有线（可 Ctrl+Z 撤回）">清本页</button>
    <button id="clrInkAll" title="清掉全部页面的线（可 Ctrl+Z 撤回）">清全部</button>
  </div>
</div>
<div class="hint">黑色方块 = 原文用黑体或下划线标出的重点与填空：<b class="k">鼠标悬停</b>显示答案，<b class="k">点一下</b>常亮（再点复原）。共 __PAGES__ 页。<br>
<b class="k">双击页面任意位置</b>可以写批注（能拖动、换颜色）；点顶部 <b class="k">✎ 画笔</b> 可在页面上按住鼠标随手画线 —— 圈重点、划横线、荧光笔都行，再点一次「画笔」退出，画错了按 <b class="k">Ctrl+Z</b> 撤销。<br>
批注和手绘都自动存在本机浏览器里。<b class="k">换浏览器或清理缓存前</b>，记得点「导出」存一份备份。</div>
<main>
__BODY__
</main>
<div class="foot">__FOOTER__</div>
<script>
document.querySelectorAll('b.b').forEach(function(el){
  el.addEventListener('click', function(e){
    e.preventDefault();
    el.classList.toggle('on');
  });
});
(function(){
  var bAll = document.getElementById('all');
  var bNone = document.getElementById('none');
  if (bAll) bAll.onclick = function(){
    document.querySelectorAll('b.b').forEach(function(e){ e.classList.add('on'); });
  };
  if (bNone) bNone.onclick = function(){
    document.querySelectorAll('b.b').forEach(function(e){ e.classList.remove('on'); });
  };
})();

/* ================= 批注 ================= */
(function(){
  var DOC = '__DOCKEY__';
  var KEY = 'pdfmask-notes::' + DOC;
  var IKEY = 'pdfmask-ink::' + DOC;
  var COLORS = ['#fff3a8','#c8f2c8','#c9e4ff','#ffd6e0','#ffe0b3','#e6d9ff'];
  var notes = [];
  try { notes = JSON.parse(localStorage.getItem(KEY) || '[]') || []; } catch (e) { notes = []; }
  var strokes = [];
  try { strokes = JSON.parse(localStorage.getItem(IKEY) || '[]') || []; } catch (e) { strokes = []; }
  function saveInk(){ try { localStorage.setItem(IKEY, JSON.stringify(strokes)); } catch (e) {} }

  function persist(){
    try { localStorage.setItem(KEY, JSON.stringify(notes)); }
    catch (e) { console.warn('批注保存失败：', e); }
  }
  function find(id){
    for (var i = 0; i < notes.length; i++) if (notes[i].id === id) return notes[i];
    return null;
  }

  function build(n){
    var el = document.createElement('div');
    el.className = 'note';
    el.setAttribute('data-id', n.id);
    el.style.background = n.color;
    el.style.left = (n.x * 100) + '%';
    el.style.top  = (n.y * 100) + '%';

    var bar = document.createElement('div');
    bar.className = 'nb';
    var dots = document.createElement('div');
    dots.className = 'dots';
    COLORS.forEach(function(c){
      var d = document.createElement('i');
      d.style.background = c;
      d.title = '换成这个颜色';
      d.addEventListener('click', function(){
        n.color = c; el.style.background = c; persist();
      });
      dots.appendChild(d);
    });
    var del = document.createElement('button');
    del.className = 'dx'; del.type = 'button'; del.textContent = '\u00d7';
    del.title = '删除这条批注';
    del.addEventListener('click', function(){ drop(n.id); });
    bar.appendChild(dots);
    bar.appendChild(del);

    var body = document.createElement('div');
    body.className = 'nt';
    body.contentEditable = 'true';
    body.spellcheck = false;
    body.textContent = n.text || '';
    var timer;
    body.addEventListener('input', function(){
      n.text = body.textContent;
      clearTimeout(timer);
      timer = setTimeout(persist, 400);
    });
    body.addEventListener('blur', function(){
      n.text = body.textContent;
      if (!n.text.trim()) drop(n.id); else persist();
    });

    el.appendChild(bar);
    el.appendChild(body);

    /* 按住顶部工具条拖动 */
    var drag = null;
    bar.addEventListener('pointerdown', function(ev){
      if (ev.target.closest('.dots') || ev.target.closest('.dx')) return;
      ev.preventDefault();
      var page = el.closest('.page');
      var pr = page.getBoundingClientRect();
      var nr = el.getBoundingClientRect();
      drag = { ox: ev.clientX - nr.left, oy: ev.clientY - nr.top, page: page, pr: pr, bar: bar };
      bar.setPointerCapture(ev.pointerId);
    });
    bar.addEventListener('pointermove', function(ev){
      if (!drag) return;
      var x = ev.clientX - drag.pr.left - drag.ox;
      var y = ev.clientY - drag.pr.top - drag.oy;
      x = Math.max(0, Math.min(drag.pr.width - 60, x));
      y = Math.max(0, Math.min(drag.pr.height - 26, y));
      el.style.left = x + 'px';
      el.style.top = y + 'px';
    });
    bar.addEventListener('pointerup', function(){
      if (!drag) return;
      var pr = drag.pr;
      var r = el.getBoundingClientRect();
      n.x = Math.max(0, Math.min(0.95, (r.left - pr.left) / pr.width));
      n.y = Math.max(0, Math.min(0.95, (r.top - pr.top) / pr.height));
      el.style.left = (n.x * 100) + '%';
      el.style.top = (n.y * 100) + '%';
      drag = null;
      persist();
    });

    return el;
  }

  function add(n, focus){
    var page = document.getElementById('p' + n.page);
    if (!page) return;
    var el = build(n);
    page.appendChild(el);
    if (focus) setTimeout(function(){
      var t = el.querySelector('.nt');
      t.focus();
      var s = window.getSelection && window.getSelection();
      if (s) s.removeAllRanges();
    }, 30);
  }

  function drop(id){
    var n = find(id);
    if (n) { notes.splice(notes.indexOf(n), 1); persist(); }
    var el = document.querySelector('.note[data-id="' + id + '"]');
    if (el) el.remove();
  }

  function redraw(){
    document.querySelectorAll('.note').forEach(function(e){ e.remove(); });
    notes.forEach(function(n){ add(n, false); });
  }

  /* 双击新建 */
  var mainEl = document.querySelector('main');
  if (mainEl) mainEl.addEventListener('dblclick', function(e){
    if (document.body.classList.contains('draw')) return;
    if (e.target.closest('.note')) return;
    var page = e.target.closest('.page');
    if (!page) return;
    var pr = page.getBoundingClientRect();
    var n = {
      id: 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      page: parseInt(page.id.slice(1), 10),
      x: Math.min(0.7, Math.max(0.01, (e.clientX - pr.left) / pr.width)),
      y: Math.min(0.93, Math.max(0.01, (e.clientY - pr.top) / pr.height)),
      color: COLORS[0],
      text: ''
    };
    notes.push(n);
    persist();
    add(n, true);
    var s = window.getSelection && window.getSelection();
    if (s) s.removeAllRanges();
    e.preventDefault();
  });

  /* 导出 / 导入 / 清空 */
  var bExp = document.getElementById('exp');
  var bImp = document.getElementById('imp');
  var bClr = document.getElementById('clr');
  var fImp = document.getElementById('impf');
  if (bExp) bExp.onclick = function(){
    if (!notes.length && !strokes.length) { alert('还没有批注或涂鸦'); return; }
    var d = new Date();
    var name = '批注_' + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2) + '.json';
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({ version: 2, notes: notes, strokes: strokes }, null, 1)], { type: 'application/json' }));
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  };
  if (bImp) bImp.onclick = function(){ if (fImp) fImp.click(); };
  if (fImp) fImp.addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      var data, addNotes = [], addInk = [];
      try { data = JSON.parse(fr.result); } catch (err) { alert('这个文件不是有效的备份'); return; }
      if (Array.isArray(data)) addNotes = data;                 // 旧版：只有批注
      else if (data && typeof data === 'object') {
        if (Array.isArray(data.notes)) addNotes = data.notes;
        if (Array.isArray(data.strokes)) addInk = data.strokes;
      } else { alert('这个文件不是有效的备份'); return; }
      var n = 0;
      addNotes.forEach(function(x){
        if (!x || !x.id || !x.page) return;
        var old = find(x.id);
        if (old) { old.x = x.x; old.y = x.y; old.color = x.color; old.text = x.text; }
        else notes.push(x);
        n++;
      });
      var k = 0;
      addInk.forEach(function(x){
        if (!x || !x.p || !x.pts || !x.pts.length) return;
        if (x.id && strokes.some(function(s){ return s.id === x.id; })) return;
        strokes.push(x);
        k++;
      });
      persist();
      saveInk();
      redraw();
      repaintAll();
      ensureVisible();
      alert('已导入：批注 ' + n + ' 条，涂鸦 ' + k + ' 笔');
    };
    fr.readAsText(f);
    e.target.value = '';
  });
  if (bClr) bClr.onclick = function(){
    if (!notes.length) { alert('还没有批注'); return; }
    if (!confirm('确定删除全部 ' + notes.length + ' 条批注？删除后无法恢复')) return;
    notes = [];
    persist();
    redraw();
  };

  /* ================= 手绘涂鸦 ================= */
  var PKEY = 'pdfmask-pen::' + DOC;
  var penPref = { on: false, c: '#e23b2e', w: 0.0035 };
  try {
    var savedPen = JSON.parse(localStorage.getItem(PKEY) || 'null');
    if (savedPen && typeof savedPen === 'object'){
      penPref.on = !!savedPen.on;
      if (savedPen.c) penPref.c = savedPen.c;
      if (savedPen.w) penPref.w = savedPen.w;
    }
  } catch (e) {}
  var inkColor = penPref.c;
  var inkWidth = penPref.w;
  var eraserOn = false;
  var drawOn = false;
  var inkTimer = null;
  function savePenPref(){
    try { localStorage.setItem(PKEY, JSON.stringify({ on: drawOn, c: inkColor, w: inkWidth })); } catch (e) {}
  }

  function pnoOf(el){ return parseInt(el.id.slice(1), 10); }
  function newInkId(){ return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function hasInk(pno){
    for (var i = 0; i < strokes.length; i++) if (strokes[i].p === pno) return true;
    return false;
  }
  function laterSaveInk(){ clearTimeout(inkTimer); inkTimer = setTimeout(saveInk, 500); }

  function paint(cv, el){
    var r = el.getBoundingClientRect();
    if (r.width < 4) return;
    var dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    cv.style.width = r.width + 'px';
    cv.style.height = r.height + 'px';
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, r.width, r.height);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    var pno = pnoOf(el);
    for (var i = 0; i < strokes.length; i++){
      var s = strokes[i];
      if (s.p !== pno || !s.pts || s.pts.length < 4) continue;
      ctx.strokeStyle = s.c;
      ctx.lineWidth = Math.max(1, s.w * r.width);
      ctx.beginPath();
      ctx.moveTo(s.pts[0] * r.width, s.pts[1] * r.height);
      for (var j = 2; j < s.pts.length; j += 2){
        ctx.lineTo(s.pts[j] * r.width, s.pts[j + 1] * r.height);
      }
      ctx.stroke();
    }
    cv.dataset.w = String(Math.round(r.width));
  }

  function repaintAll(){
    document.querySelectorAll('.page canvas.ink').forEach(function(cv){
      if (cv.parentNode) paint(cv, cv.parentNode);
    });
  }

  function ready(el){
    var pno = pnoOf(el);
    var cv = el.querySelector('canvas.ink');
    if (!drawOn && !hasInk(pno)){
      if (cv) cv.remove();
      return null;
    }
    if (!cv){
      cv = document.createElement('canvas');
      cv.className = 'ink';
      el.appendChild(cv);
      bindInk(cv, el);
    }
    paint(cv, el);           /* 每次进入视口都重绘，保证撤销/导入后画面正确 */
    return cv;
  }

  function ensureVisible(){
    document.querySelectorAll('.page').forEach(function(el){
      var r = el.getBoundingClientRect();
      if (r.bottom > -320 && r.top < window.innerHeight + 320) ready(el);
    });
  }

  function currentPage(){
    var mid = window.innerHeight / 2, best = null, bestD = 1e9;
    document.querySelectorAll('.page').forEach(function(el){
      var r = el.getBoundingClientRect();
      if (r.bottom < 70 || r.top > window.innerHeight - 70) return;
      var d = Math.abs((r.top + r.bottom) / 2 - mid);
      if (d < bestD){ bestD = d; best = el; }
    });
    return best;
  }

  /* ---- 撤销栈：画一笔 / 擦一笔 / 清页 / 清全部 都能撤回 ---- */
  var undoStack = [];
  function pushUndo(fn){
    undoStack.push(fn);
    if (undoStack.length > 120) undoStack.shift();
  }
  function doUndo(){
    if (!undoStack.length) return false;
    var fn = undoStack.pop();
    try { fn(); } catch (e) {}
    saveInk();
    ensureVisible();
    return true;
  }

  function bindInk(cv, el){
    var cur = null, rect = null;
    function pos(ev){
      return { x: (ev.clientX - rect.left) / rect.width, y: (ev.clientY - rect.top) / rect.height };
    }
    function eraseAt(x, y){
      var pno = pnoOf(el);
      var rad = Math.max(0.014, inkWidth * 4);
      for (var i = strokes.length - 1; i >= 0; i--){
        var s = strokes[i];
        if (s.p !== pno) continue;
        for (var j = 0; j < s.pts.length; j += 2){
          var dx = s.pts[j] - x, dy = s.pts[j + 1] - y;
          if (dx * dx + dy * dy < rad * rad){
            var gone = strokes.splice(i, 1)[0];
            pushUndo(function(){
              if (!strokes.some(function(q){ return q.id === gone.id; })) strokes.push(gone);
            });
            saveInk();
            paint(cv, el);
            return;
          }
        }
      }
    }
    cv.addEventListener('pointerdown', function(e){
      if (!drawOn) return;
      e.preventDefault();
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}
      rect = cv.getBoundingClientRect();
      var p = pos(e);
      if (eraserOn){ cur = null; eraseAt(p.x, p.y); return; }
      cur = { id: newInkId(), p: pnoOf(el), c: inkColor, w: inkWidth, pts: [p.x, p.y] };
      strokes.push(cur);
      (function(cid){
        pushUndo(function(){
          strokes = strokes.filter(function(s){ return s.id !== cid; });
        });
      })(cur.id);
      var ctx = cv.getContext('2d');
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = cur.c;
      ctx.lineWidth = Math.max(1, cur.w * rect.width);
      ctx.beginPath();
      ctx.moveTo(p.x * rect.width, p.y * rect.height);
      ctx.lineTo(p.x * rect.width + 0.02, p.y * rect.height);
      ctx.stroke();
    });
    cv.addEventListener('pointermove', function(e){
      if (!drawOn || !rect) return;
      var p = pos(e);
      if (eraserOn){
        if (e.buttons) eraseAt(p.x, p.y);
        return;
      }
      if (!cur) return;
      var n = cur.pts.length;
      var lx = cur.pts[n - 2], ly = cur.pts[n - 1];
      if (Math.abs(p.x - lx) < 0.0009 && Math.abs(p.y - ly) < 0.0009) return;
      var ctx = cv.getContext('2d');
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = cur.c;
      ctx.lineWidth = Math.max(1, cur.w * rect.width);
      ctx.beginPath();
      ctx.moveTo(lx * rect.width, ly * rect.height);
      ctx.lineTo(p.x * rect.width, p.y * rect.height);
      ctx.stroke();
      cur.pts.push(p.x, p.y);
      laterSaveInk();
    });
    function end(){
      if (cur){ cur = null; saveInk(); }
      rect = null;
    }
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);
  }

  function setEraser(on){
    eraserOn = on;
    document.body.classList.toggle('eraser', on);
    var eb = document.getElementById('eraserBtn');
    if (eb) eb.classList.toggle('act', on);
  }

  function setDraw(on){
    drawOn = on;
    document.body.classList.toggle('draw', on);
    var b = document.getElementById('penBtn');
    if (b) b.classList.toggle('act', on);
    if (!on){
      setEraser(false);
      document.querySelectorAll('.page canvas.ink').forEach(function(cv){
        if (!hasInk(pnoOf(cv.parentNode))) cv.remove();
      });
    }
    savePenPref();
    ensureVisible();
  }

  var penBtn = document.getElementById('penBtn');
  if (penBtn) penBtn.onclick = function(){ setDraw(!drawOn); };
  var penX = document.getElementById('exitPen2');
  if (penX) penX.onclick = function(){ setDraw(false); };

  document.querySelectorAll('#pen .pc').forEach(function(d){
    d.addEventListener('click', function(){
      inkColor = d.dataset.c;
      document.querySelectorAll('#pen .pc').forEach(function(x){ x.classList.remove('act'); });
      d.classList.add('act');
      setEraser(false);
      savePenPref();
    });
  });
  document.querySelectorAll('#pen .pw').forEach(function(b){
    b.addEventListener('click', function(){
      inkWidth = parseFloat(b.dataset.w);
      document.querySelectorAll('#pen .pw').forEach(function(x){ x.classList.remove('act'); });
      b.classList.add('act');
      setEraser(false);
      savePenPref();
    });
  });
  var eraserBtn = document.getElementById('eraserBtn');
  if (eraserBtn) eraserBtn.onclick = function(){ setEraser(!eraserOn); };

  var undoInk = document.getElementById('undoInk');
  if (undoInk) undoInk.onclick = function(){
    if (!doUndo()) alert('没有可撤销的操作了');
  };
  var clrInk = document.getElementById('clrInk');
  if (clrInk) clrInk.onclick = function(){
    var el = currentPage();
    if (!el) return;
    var pno = pnoOf(el);
    if (!hasInk(pno)){ alert('第 ' + pno + ' 页还没有手绘'); return; }
    if (!confirm('清掉第 ' + pno + ' 页的手绘？（可按 Ctrl+Z 撤回）')) return;
    var removed = strokes.filter(function(s){ return s.p === pno; });
    pushUndo(function(){ strokes = strokes.concat(removed); });
    strokes = strokes.filter(function(s){ return s.p !== pno; });
    saveInk();
    repaintAll();
  };
  var clrInkAll = document.getElementById('clrInkAll');
  if (clrInkAll) clrInkAll.onclick = function(){
    if (!strokes.length){ alert('还没有手绘'); return; }
    if (!confirm('清掉全部 ' + strokes.length + ' 笔手绘？（可按 Ctrl+Z 撤回）')) return;
    var all = strokes.slice();
    pushUndo(function(){ strokes = all; });
    strokes = [];
    saveInk();
    repaintAll();
    ensureVisible();
  };

  /* Ctrl+Z / ⌘+Z 撤销 */
  document.addEventListener('keydown', function(e){
    if (!(e.ctrlKey || e.metaKey) || e.shiftKey || e.altKey) return;
    if (e.key !== 'z' && e.key !== 'Z') return;
    var ae = document.activeElement;
    if (ae && (ae.isContentEditable || ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
    if (!undoStack.length) return;
    e.preventDefault();
    doUndo();
  });

  var scrollT;
  window.addEventListener('scroll', function(){
    clearTimeout(scrollT);
    scrollT = setTimeout(ensureVisible, 160);
  }, { passive: true });
  var sizeT;
  window.addEventListener('resize', function(){
    clearTimeout(sizeT);
    sizeT = setTimeout(function(){ repaintAll(); ensureVisible(); }, 220);
  });

  /* 恢复上次用过的画笔设置：颜色 / 粗细 / 是否开着画笔模式 */
  document.querySelectorAll('#pen .pc').forEach(function(d){
    d.classList.toggle('act', d.getAttribute('data-c') === inkColor);
  });
  document.querySelectorAll('#pen .pw').forEach(function(b){
    b.classList.toggle('act', parseFloat(b.getAttribute('data-w')) === inkWidth);
  });
  if (penPref.on) setDraw(true); else ensureVisible();

  notes.forEach(function(n){ add(n, false); });
})();
</script>
</body>
</html>
